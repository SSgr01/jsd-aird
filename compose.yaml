name: jsd-aird

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18
    container_name: jsd-aird-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jsd_aird}
      POSTGRES_USER: ${POSTGRES_USER:-jsd_aird}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jsd_aird_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-jsd_aird} -d ${POSTGRES_DB:-jsd_aird}
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: jsd-aird-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-jsd_aird}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-jsd_aird_minio_dev}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        - CMD
        - mc
        - ready
        - local
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  jsd-aird-ai:
    build:
      context: ./jsd-aird-ai
      dockerfile: Dockerfile
    image: jsd-aird-ai:0.5.0
    container_name: jsd-aird-ai
    environment:
      JSD_AIRD_AI_HOST: 0.0.0.0
      JSD_AIRD_AI_PORT: 8090
      JSD_AIRD_AI_INTERNAL_TOKEN: ${JSD_AIRD_AI_INTERNAL_TOKEN:-}
      JSD_AIRD_AI_ALLOW_FILE_URLS: "false"
      JSD_AIRD_AI_TMP: /tmp/jsd-aird-ai
      JSD_AIRD_AI_MAX_ARTIFACT_BYTES: ${JSD_AIRD_AI_MAX_ARTIFACT_BYTES:-536870912}
      JSD_AIRD_AI_MODEL_CACHE_ENTRIES: ${JSD_AIRD_AI_MODEL_CACHE_ENTRIES:-4}
      JSD_AIRD_AI_MODEL_THREADS: ${JSD_AIRD_AI_MODEL_THREADS:-2}
    ports:
      - "${JSD_AIRD_AI_PORT:-8090}:8090"
    read_only: true
    tmpfs:
      - /tmp/jsd-aird-ai:size=1g,mode=1770,uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    restart: unless-stopped

volumes:
  postgres-data:
    name: jsd-aird-postgres-data
  minio-data:
    name: jsd-aird-minio-data
