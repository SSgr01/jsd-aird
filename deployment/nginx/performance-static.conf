# Merge into the EXISTING port-82 server block after inspecting nginx -T.
# Adjust these paths to the real installation. Do not replace any API/download/SSE locations.
# This layout corresponds to deployment/release-web.sh.
root /srv/jsd-aird/web/current;

location ^~ /assets/ {
    root /srv/jsd-aird/web/shared;
    try_files $uri =404;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types application/javascript text/javascript text/css image/svg+xml application/json;
    expires off;
    add_header Cache-Control "public, max-age=2592000, immutable";
    # Repeat any security add_header directives required by the parent here.
    # Without 'always', 404 responses do not acquire an immutable cache policy.
}

location = /index.html {
    try_files $uri =404;
    expires off;
    add_header Cache-Control "no-cache" always;
}

location = /build-info.json {
    try_files $uri =404;
    expires off;
    add_header Cache-Control "no-store" always;
}

