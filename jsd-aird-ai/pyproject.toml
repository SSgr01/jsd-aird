[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "jsd-aird-ai"
version = "0.5.0"
description = "JSD-AIRD T07-PRE formula model, validation and BayBE compute service"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "baybe==0.15.0",
  "catboost==1.2.10",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "joblib==1.5.1",
  "lightgbm==4.7.0",
  "numpy==2.3.2",
  "pandas==2.3.2",
  "pyarrow==21.0.0",
  "pydantic==2.11.7",
  "scikit-learn==1.7.1",
  "scipy==1.16.1",
  "uvicorn[standard]==0.35.0",
  "xgboost==3.2.0",
]

[project.optional-dependencies]
test = [
  "jsonschema==4.25.1",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "PyYAML==6.0.3",
]

[project.scripts]
jsd-aird-ai = "jsd_aird_ai.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/jsd_aird_ai"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "golden: exercises the full 400-row UV/PU synthetic snapshot",
]

[tool.coverage.run]
branch = true
source = ["jsd_aird_ai"]
