spring:
  application:
    name: jsd-aird-api
  datasource:
    url: ${JSD_AIRD_DATASOURCE_URL:jdbc:postgresql://localhost:5432/jsd_aird}
    username: ${JSD_AIRD_DATASOURCE_USERNAME:jsd_aird}
    password: ${JSD_AIRD_DATASOURCE_PASSWORD:jsd_aird_dev}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      connection-timeout: 30000
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
  modulith:
    detection-strategy: explicitly-annotated
  servlet:
    multipart:
      max-file-size: -1
      max-request-size: -1

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    version: openapi_3_1
  paths-to-match: /api/**

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
  global-config:
    banner: false
    db-config:
      id-type: assign_uuid

app:
  web:
    allowed-origins: ${JSD_AIRD_ALLOWED_ORIGINS:http://localhost:5173}
  identity:
    development-mode: ${JSD_AIRD_DEV_IDENTITY_ENABLED:true}
  storage:
    endpoint: ${JSD_AIRD_MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${JSD_AIRD_MINIO_ACCESS_KEY:jsd_aird}
    secret-key: ${JSD_AIRD_MINIO_SECRET_KEY:jsd_aird_minio_dev}
    bucket: ${JSD_AIRD_MINIO_BUCKET:jsd-aird}
  worker:
    enabled: ${JSD_AIRD_WORKER_ENABLED:false}
    id: ${JSD_AIRD_WORKER_ID:api-local}
    poll-delay: ${JSD_AIRD_WORKER_POLL_DELAY:2s}
    lease-duration: ${JSD_AIRD_WORKER_LEASE_DURATION:60s}
  model:
    base-url: ${JSD_AIRD_MODEL_BASE_URL:${OPENAI_BASE_URL:}}
    api-key: ${JSD_AIRD_MODEL_API_KEY:${OPENAI_API_KEY:}}
    model: ${JSD_AIRD_MODEL_NAME:${OPENAI_MODEL:}}
    temperature: 0.0
    response-format: ${JSD_AIRD_MODEL_RESPONSE_FORMAT:json_schema}
    enable-thinking: ${JSD_AIRD_MODEL_ENABLE_THINKING:true}
    thinking-budget: ${JSD_AIRD_MODEL_THINKING_BUDGET:2048}
    structure-thinking-budget: ${JSD_AIRD_MODEL_STRUCTURE_THINKING_BUDGET:4096}
    semantic-thinking-budget: ${JSD_AIRD_MODEL_SEMANTIC_THINKING_BUDGET:2048}
    max-completion-tokens: ${JSD_AIRD_MODEL_MAX_COMPLETION_TOKENS:12000}
    max-token-parameter: ${JSD_AIRD_MODEL_MAX_TOKEN_PARAMETER:max_tokens}
    auto-retry-count: ${JSD_AIRD_MODEL_AUTO_RETRY_COUNT:2}
    visual-mode: ${JSD_AIRD_MODEL_VISUAL_MODE:auto}
    visual-enabled: ${JSD_AIRD_MODEL_VISUAL_ENABLED:false}
  render:
    enabled: ${JSD_AIRD_RENDER_ENABLED:true}
    frontend-base-url: ${JSD_AIRD_RENDER_FRONTEND_BASE_URL:http://localhost:5173}
    node-command: ${JSD_AIRD_RENDER_NODE_COMMAND:node}
    capture-script: ${JSD_AIRD_RENDER_CAPTURE_SCRIPT:../jsd-aird-web/scripts/capture-template-render.mjs}
    browser-path: ${JSD_AIRD_RENDER_BROWSER_PATH:}
    timeout: ${JSD_AIRD_RENDER_TIMEOUT:20s}
  recognition:
    audit-cleanup-cron: ${JSD_AIRD_RECOGNITION_AUDIT_CLEANUP_CRON:0 30 2 * * *}
    console-log-summary: ${JSD_AIRD_RECOGNITION_CONSOLE_LOG_SUMMARY:true}
    console-log-payload: ${JSD_AIRD_RECOGNITION_CONSOLE_LOG_PAYLOAD:true}
    allow-legacy-region-envelope: ${JSD_AIRD_RECOGNITION_ALLOW_LEGACY_REGION_ENVELOPE:false}
  template-recognition:
    topology-v2:
      enabled: ${JSD_AIRD_TEMPLATE_RECOGNITION_TOPOLOGY_V2_ENABLED:true}
  production-instance-ingest:
    enabled: ${JSD_AIRD_PRODUCTION_INSTANCE_INGEST_ENABLED:true}
  production-instance-photo:
    enabled: ${JSD_AIRD_PRODUCTION_INSTANCE_PHOTO_ENABLED:true}
