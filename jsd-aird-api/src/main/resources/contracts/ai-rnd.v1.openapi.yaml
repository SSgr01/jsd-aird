openapi: 3.1.0
info:
  title: JSD-AIRD AI研发业务契约
  version: ai-rnd.v1
  description: R01冻结、R02落地的AI研发契约；建模配置接口返回真实持久化状态。
servers:
  - url: /api/v1/ai/rnd
security:
  - sessionCookie: []
tags:
  - {name: Modeling}
  - {name: Eligibility}
  - {name: Models}
  - {name: Prediction}
  - {name: Research}
paths:
  /targets:
    get: {$ref: '#/components/x-operations/readTargets'}
    post: {$ref: '#/components/x-operations/createTarget'}
  /targets/{id}:
    get: {$ref: '#/components/x-operations/readTarget'}
  /targets/{id}/versions:
    get: {$ref: '#/components/x-operations/readTargetVersions'}
    post: {$ref: '#/components/x-operations/createTargetVersion'}
  /target-versions/{id}:
    patch: {$ref: '#/components/x-operations/updateTargetVersion'}
  /target-versions/{id}/publish:
    post: {$ref: '#/components/x-operations/publishTargetVersion'}
  /targets/{id}/retire:
    post: {$ref: '#/components/x-operations/retireTarget'}
  /input-fields:
    get: {$ref: '#/components/x-operations/readInputFields'}
    post: {$ref: '#/components/x-operations/createInputField'}
  /input-fields/{id}:
    get: {$ref: '#/components/x-operations/readInputField'}
  /input-fields/{id}/versions:
    get: {$ref: '#/components/x-operations/readInputFieldVersions'}
    post: {$ref: '#/components/x-operations/createInputFieldVersion'}
  /input-field-versions/{id}/publish:
    post: {$ref: '#/components/x-operations/publishInputFieldVersion'}
  /targets/{id}/source-mappings:
    get: {$ref: '#/components/x-operations/readSourceMappings'}
    post: {$ref: '#/components/x-operations/createSourceMapping'}
  /targets/{id}/source-mapping-suggestions:
    get: {$ref: '#/components/x-operations/readSourceMappingSuggestions'}
  /targets/{id}/source-mappings/confirm:
    post: {$ref: '#/components/x-operations/confirmSourceMapping'}
  /source-mappings/{id}/publish:
    post: {$ref: '#/components/x-operations/publishSourceMapping'}
  /targets/{id}/input-schemes:
    get: {$ref: '#/components/x-operations/readInputSchemes'}
    post: {$ref: '#/components/x-operations/createInputScheme'}
  /targets/{id}/input-suggestions:
    get: {$ref: '#/components/x-operations/readInputSuggestions'}
  /input-schemes/{id}/preview:
    post: {$ref: '#/components/x-operations/previewInputScheme'}
  /input-schemes/{id}/freeze:
    post: {$ref: '#/components/x-operations/freezeInputScheme'}
  /eligibility/summary:
    get: {$ref: '#/components/x-operations/readEligibilitySummary'}
  /eligibility:
    get: {$ref: '#/components/x-operations/readEligibility'}
  /eligibility/{id}:
    get: {$ref: '#/components/x-operations/readEligibilityItem'}
  /reviews/{id}/decisions:
    post: {$ref: '#/components/x-operations/decideReview'}
  /training-settings:
    get: {$ref: '#/components/x-operations/readTrainingSettings'}
    put: {$ref: '#/components/x-operations/updateTrainingSettings'}
  /training-jobs/evaluate:
    post: {$ref: '#/components/x-operations/evaluateTrainingTargets'}
  /training-jobs:
    get: {$ref: '#/components/x-operations/readTrainingJobs'}
  /training-jobs/{id}:
    get: {$ref: '#/components/x-operations/readTrainingJob'}
  /targets/{id}/reevaluate:
    post: {$ref: '#/components/x-operations/reevaluateTarget'}
  /training-jobs/{id}/retry:
    post: {$ref: '#/components/x-operations/retryTrainingJob'}
  /training-jobs/{id}/cancel:
    post: {$ref: '#/components/x-operations/cancelTrainingJob'}
  /models:
    get: {$ref: '#/components/x-operations/readModels'}
  /models/{id}:
    get: {$ref: '#/components/x-operations/readModel'}
  /models/{id}/comparison:
    get: {$ref: '#/components/x-operations/compareModel'}
  /models/{id}/activate:
    post: {$ref: '#/components/x-operations/activateModel'}
  /models/{id}/rollback:
    post: {$ref: '#/components/x-operations/rollbackModel'}
  /models/{id}/pause:
    post: {$ref: '#/components/x-operations/pauseModel'}
  /snapshots/{id}:
    get: {$ref: '#/components/x-operations/readSnapshot'}
  /snapshots/{id}/items:
    get: {$ref: '#/components/x-operations/readSnapshotItems'}
  /training-policies:
    get: {$ref: '#/components/x-operations/readTrainingPolicies'}
    post: {$ref: '#/components/x-operations/createTrainingPolicy'}
  /training-policies/{id}/publish:
    post: {$ref: '#/components/x-operations/publishTrainingPolicy'}
  /reference/standard-fields:
    get: {$ref: '#/components/x-operations/readStandardFieldReferences'}
  /reference/materials:
    get: {$ref: '#/components/x-operations/readMaterialReferences'}
  /material-aliases:
    get: {$ref: '#/components/x-operations/readMaterialAliases'}
    post: {$ref: '#/components/x-operations/createMaterialAlias'}
  /material-aliases/{id}/retire:
    post: {$ref: '#/components/x-operations/retireMaterialAlias'}
  /material-dictionaries:
    get: {$ref: '#/components/x-operations/readMaterialDictionaries'}
    post: {$ref: '#/components/x-operations/createMaterialDictionary'}
  /material-dictionaries/{id}/freeze:
    post: {$ref: '#/components/x-operations/freezeMaterialDictionary'}
  /material-dictionaries/{id}/retire:
    post: {$ref: '#/components/x-operations/retireMaterialDictionary'}
  /samples:
    get: {$ref: '#/components/x-operations/readSamples'}
  /samples/{id}:
    get: {$ref: '#/components/x-operations/readSample'}
  /facts/reconcile:
    post: {$ref: '#/components/x-operations/reconcileFacts'}
  /prediction-context:
    get: {$ref: '#/components/x-operations/readPredictionContext'}
  /targets/{id}/quality-policies:
    get: {$ref: '#/components/x-operations/readQualityPolicies'}
    post: {$ref: '#/components/x-operations/createQualityPolicy'}
  /quality-policies/{id}/publish:
    post: {$ref: '#/components/x-operations/publishQualityPolicy'}
  /predictions:
    post: {$ref: '#/components/x-operations/createPrediction'}
  /formula-designs:
    post: {$ref: '#/components/x-operations/createFormulaDesign'}
  /experiment-optimizations:
    post: {$ref: '#/components/x-operations/createOptimization'}
  /experiment-optimizations/{id}:
    get: {$ref: '#/components/x-operations/readOptimization'}
  /optimization-baselines:
    get: {$ref: '#/components/x-operations/readOptimizationBaselines'}
  /optimization-context:
    get: {$ref: '#/components/x-operations/readOptimizationContext'}
  /research-runs:
    get: {$ref: '#/components/x-operations/readResearchRuns'}
  /research-runs/{id}:
    get: {$ref: '#/components/x-operations/readResearchRun'}
  /research-runs/{id}/experiment-drafts:
    post: {$ref: '#/components/x-operations/createExperimentDrafts'}
  /research-runs/{id}/experiment-links:
    get: {$ref: '#/components/x-operations/readExperimentLinks'}
  /research-runs/{id}/feedback:
    get: {$ref: '#/components/x-operations/readOptimizationFeedback'}
  /prediction-records/{id}:
    get: {$ref: '#/components/x-operations/readPredictionRecord'}
components:
  securitySchemes:
    sessionCookie: {type: apiKey, in: cookie, name: JSESSIONID}
  parameters:
    Id: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    Page: {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
    Size: {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
    Keyword: {name: keyword, in: query, schema: {type: string, maxLength: 200}}
    Status: {name: status, in: query, schema: {type: string, maxLength: 40}}
    ValueType: {name: valueType, in: query, schema: {type: string, maxLength: 40}}
    Category: {name: category, in: query, schema: {type: string, maxLength: 160}}
    TargetId: {name: targetId, in: query, schema: {type: string, format: uuid}}
    TargetIds: {name: targetId, in: query, style: form, explode: true, schema: {type: array, items: {type: string, format: uuid}}}
    RequestId: {name: X-Request-Id, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 160}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
  schemas:
    JsonObject: {type: object, additionalProperties: true}
    Page:
      type: object
      required: [items, total, page, size]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/JsonObject'}}
        total: {type: integer, minimum: 0}
        page: {type: integer, minimum: 1}
        size: {type: integer, minimum: 1, maximum: 100}
    VersionCommand:
      type: object
      additionalProperties: false
      required: [expectedRevision]
      properties: {expectedRevision: {type: integer, minimum: 0}}
    RetireCommand:
      type: object
      additionalProperties: false
      required: [expectedRevision, reason]
      properties:
        expectedRevision: {type: integer, minimum: 0}
        reason: {type: string, minLength: 1, maxLength: 1000}
    TargetCommand:
      type: object
      additionalProperties: false
      required: [code, name, category, valueType, classes, definition, observationSemantics]
      properties:
        code: {type: string, minLength: 1, maxLength: 160}
        name: {type: string, minLength: 1, maxLength: 240}
        category: {type: string, minLength: 1, maxLength: 160}
        valueType: {enum: [CONTINUOUS, ORDINAL, BINARY, CATEGORICAL]}
        unit: {type: [string, 'null'], maxLength: 80}
        classes: {type: array, items: {type: string}}
        definition: {$ref: '#/components/schemas/JsonObject'}
        observationSemantics: {$ref: '#/components/schemas/JsonObject'}
        expectedRevision: {type: [integer, 'null'], minimum: 0}
        resultStandardFieldCode: {type: [string, 'null'], maxLength: 100, description: Stable result data-field binding code}
        catalogProposalId: {type: [string, 'null'], format: uuid, description: Optional customer-catalog proposal evidence}
    TargetSummary:
      type: object
      additionalProperties: false
      required: [id, code, name, category, valueType, status, evaluationStatus, trainingStatus, revision, updatedAt]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        name: {type: string}
        category: {type: string}
        valueType: {enum: [CONTINUOUS, ORDINAL, BINARY, CATEGORICAL]}
        status: {enum: [DRAFT, ACTIVE, PAUSED, RETIRED]}
        currentVersionId: {type: [string, 'null'], format: uuid}
        currentVersion: {type: [integer, 'null']}
        currentInputSchemeId: {type: [string, 'null'], format: uuid}
        currentInputSchemeName: {type: [string, 'null']}
        activeModelVersionId: {type: [string, 'null'], format: uuid}
        evaluationStatus: {enum: [NOT_EVALUATED, EVALUATED]}
        trainingStatus: {enum: [NOT_TRAINED, ACTIVE]}
        revision: {type: integer, minimum: 0}
        updatedAt: {type: string, format: date-time}
    InputFieldCommand:
      type: object
      additionalProperties: false
      required: [code, name, valueType, availabilityStage, definition, preprocessing]
      properties:
        code: {type: string, minLength: 1, maxLength: 160}
        name: {type: string, minLength: 1, maxLength: 240}
        valueType: {enum: [NUMBER, STRING, BOOLEAN, CATEGORY, COMPOSITION]}
        unit: {type: [string, 'null'], maxLength: 80}
        availabilityStage: {enum: [PRE_EXPERIMENT, POST_EXPERIMENT]}
        standardFieldDictionaryId: {type: [string, 'null'], format: uuid}
        definition: {$ref: '#/components/schemas/JsonObject'}
        preprocessing: {$ref: '#/components/schemas/JsonObject'}
        expectedRevision: {type: [integer, 'null'], minimum: 0}
    InputFieldSummary:
      type: object
      additionalProperties: false
      required: [id, code, name, valueType, availabilityStage, status, revision, updatedAt]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        name: {type: string}
        valueType: {enum: [NUMBER, STRING, BOOLEAN, CATEGORY, COMPOSITION]}
        unit: {type: [string, 'null']}
        availabilityStage: {enum: [PRE_EXPERIMENT, POST_EXPERIMENT]}
        status: {enum: [DRAFT, ACTIVE, PAUSED, RETIRED]}
        currentVersionId: {type: [string, 'null'], format: uuid}
        currentVersion: {type: [integer, 'null']}
        standardFieldCode: {type: [string, 'null']}
        revision: {type: integer, minimum: 0}
        updatedAt: {type: string, format: date-time}
    SourceMappingCommand:
      type: object
      additionalProperties: false
      required: [targetVersionId, sourceType, mapping, expectedRevision]
      properties:
        targetVersionId: {type: string, format: uuid}
        sourceType: {enum: [DATA_CENTER, EXPERIMENT]}
        mapping: {$ref: '#/components/schemas/JsonObject'}
        expectedRevision: {type: integer, minimum: 0}
    InputSchemeFieldCommand:
      type: object
      additionalProperties: false
      required: [inputFieldVersionId, required, ordinal, override]
      properties:
        inputFieldVersionId: {type: string, format: uuid}
        required: {const: true}
        ordinal: {type: integer, minimum: 0}
        override: {$ref: '#/components/schemas/JsonObject'}
    InputSchemeCommand:
      type: object
      additionalProperties: false
      required: [targetVersionId, code, name, fields, preprocessing, expectedRevision]
      properties:
        targetVersionId: {type: string, format: uuid}
        materialDictionaryVersionId: {type: [string, 'null'], format: uuid}
        code: {type: string, minLength: 1, maxLength: 160}
        name: {type: string, minLength: 1, maxLength: 240}
        fields: {type: array, minItems: 1, items: {$ref: '#/components/schemas/InputSchemeFieldCommand'}}
        preprocessing: {$ref: '#/components/schemas/JsonObject'}
        expectedRevision: {type: integer, minimum: 0}
    CoveragePreview:
      type: object
      additionalProperties: false
      required: [evaluationStatus, unavailableReason, validationIssues, schemaHash, changedSampleIds]
      properties:
        evaluationStatus: {const: NOT_EVALUATED}
        unavailableReason: {const: DATA_PIPELINE_NOT_READY}
        validationIssues: {type: array, items: {$ref: '#/components/schemas/JsonObject'}}
        schemaHash: {type: string, pattern: '^[0-9a-f]{64}$'}
        candidateSamples: {type: 'null'}
        trainable: {type: 'null'}
        excluded: {type: 'null'}
        reviewRequired: {type: 'null'}
        changedSampleIds: {type: array, maxItems: 0}
    FunnelStep:
      type: object
      required: [code, label, count, denominator]
      properties:
        code: {type: string}
        label: {type: string}
        count: {type: integer, minimum: 0}
        denominator: {type: integer, minimum: 0}
    FieldCoverage:
      type: object
      required: [fieldCode, fieldName, available, denominator, ratio, reasonCodes]
      properties:
        fieldCode: {type: string}
        fieldName: {type: string}
        available: {type: integer, minimum: 0}
        denominator: {type: integer, minimum: 0}
        ratio: {type: number, minimum: 0, maximum: 1}
        reasonCodes: {type: array, items: {type: string}}
    EligibilityReason:
      type: object
      required: [code, message, evidence]
      properties:
        code: {type: string}
        message: {type: string}
        fieldCode: {type: [string, 'null']}
        evidence: {$ref: '#/components/schemas/JsonObject'}
    EligibilityEvaluationRun:
      type: object
      required: [id, targetId, targetVersionId, inputSchemeId, ruleFingerprint, status]
      properties:
        id: {type: string, format: uuid}
        targetId: {type: string, format: uuid}
        targetVersionId: {type: string, format: uuid}
        inputSchemeId: {type: string, format: uuid}
        modelingPolicyVersionId: {type: [string, 'null'], format: uuid}
        ruleFingerprint: {type: string, pattern: '^[0-9a-f]{64}$'}
        asyncJobId: {type: [string, 'null'], format: uuid}
        status: {enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLED]}
        totalSamples: {type: [integer, 'null']}
        trainable: {type: [integer, 'null']}
        excluded: {type: [integer, 'null']}
        reviewRequired: {type: [integer, 'null']}
        funnel: {type: array, items: {$ref: '#/components/schemas/FunnelStep'}}
        errorCode: {type: [string, 'null']}
        errorMessage: {type: [string, 'null']}
    EligibilitySummary:
      type: object
      required: [evaluationStatus, reasonCounts, funnel, fieldCoverage]
      properties:
        evaluationStatus: {enum: [NOT_EVALUATED, RUNNING, COMPLETED, FAILED]}
        unavailableReason: {type: [string, 'null']}
        latestRun: {oneOf: [{$ref: '#/components/schemas/EligibilityEvaluationRun'}, {type: 'null'}]}
        total: {type: [integer, 'null']}
        trainable: {type: [integer, 'null']}
        excluded: {type: [integer, 'null']}
        reviewRequired: {type: [integer, 'null']}
        reasonCounts: {type: object, additionalProperties: {type: integer}}
        funnel: {type: array, items: {$ref: '#/components/schemas/FunnelStep'}}
        fieldCoverage: {type: array, items: {$ref: '#/components/schemas/FieldCoverage'}}
        evaluatedAt: {type: [string, 'null'], format: date-time}
    EligibilityItem:
      type: object
      required: [id, state, reasons, warnings]
      properties:
        id: {type: string, format: uuid}
        evaluationRunId: {type: string, format: uuid}
        sampleRevisionId: {type: string, format: uuid}
        targetVersionId: {type: string, format: uuid}
        inputSchemeId: {type: string, format: uuid}
        state: {enum: [TRAINABLE, EXCLUDED, REVIEW_REQUIRED]}
        primaryReasonCode: {type: [string, 'null']}
        reasons: {type: array, items: {$ref: '#/components/schemas/EligibilityReason'}}
        warnings: {type: array, items: {$ref: '#/components/schemas/EligibilityReason'}}
        logicalSampleKey: {type: [string, 'null']}
        authoritySourceType: {type: [string, 'null']}
        revision: {type: integer}
        evaluatedAt: {type: string, format: date-time}
    EligibilityDetail:
      type: object
      required: [eligibility, sample, reviews]
      properties:
        eligibility: {$ref: '#/components/schemas/EligibilityItem'}
        sample: {$ref: '#/components/schemas/JsonObject'}
        reviews: {type: array, items: {$ref: '#/components/schemas/JsonObject'}}
    ReviewDecisionCommand:
      type: object
      required: [decision, reason, expectedRevision]
      properties:
        decision: {enum: [KEEP, EXCLUDE, MERGE, KEEP_SEPARATE, REMAP]}
        reason: {type: string, minLength: 1}
        materialId: {type: [string, 'null'], format: uuid}
        expectedRevision: {type: integer, minimum: 0}
    RecomputeAccepted:
      type: object
      required: [runId, asyncJobId, targetId, targetVersionId, inputSchemeId, status, ruleFingerprint]
      properties:
        runId: {type: string, format: uuid}
        asyncJobId: {type: string, format: uuid}
        targetId: {type: string, format: uuid}
        targetVersionId: {type: string, format: uuid}
        inputSchemeId: {type: string, format: uuid}
        status: {enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLED]}
        ruleFingerprint: {type: string, pattern: '^[0-9a-f]{64}$'}
    TrainingPolicyCommand:
      type: object
      additionalProperties: false
      required: [targetId, qualification, validation, training, expectedRevision]
      properties:
        targetId: {type: string, format: uuid}
        qualification: {$ref: '#/components/schemas/JsonObject'}
        validation: {$ref: '#/components/schemas/JsonObject'}
        training: {$ref: '#/components/schemas/JsonObject'}
        expectedRevision: {type: integer, minimum: 0}
    MaterialAliasCommand:
      type: object
      additionalProperties: false
      required: [materialId, alias]
      properties:
        materialId: {type: string, format: uuid}
        alias: {type: string, minLength: 1, maxLength: 240}
        expectedRevision: {type: [integer, 'null'], minimum: 0}
    MaterialDictionaryItem:
      type: object
      additionalProperties: false
      required: [materialId, role, ordinal, token]
      properties:
        materialId: {type: string, format: uuid}
        role: {type: string, minLength: 1}
        ordinal: {type: integer, minimum: 0}
        token: {type: string, minLength: 1}
    MaterialDictionaryCommand:
      type: object
      additionalProperties: false
      required: [code, items, encoder]
      properties:
        code: {type: string, minLength: 1, maxLength: 160}
        items: {type: array, minItems: 1, items: {$ref: '#/components/schemas/MaterialDictionaryItem'}}
        encoder: {$ref: '#/components/schemas/JsonObject'}
        expectedRevision: {type: [integer, 'null'], minimum: 0}
    TargetVersion:
      type: object
      additionalProperties: false
      required: [id, targetId, version, status, valueType, classes, definition, observationSemantics, configHash, createdAt]
      properties:
        id: {type: string, format: uuid}
        targetId: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        status: {enum: [DRAFT, PUBLISHED, RETIRED]}
        valueType: {enum: [CONTINUOUS, ORDINAL, BINARY, CATEGORICAL]}
        unit: {type: [string, 'null']}
        classes: {type: array, items: {type: string}}
        definition: {$ref: '#/components/schemas/JsonObject'}
        observationSemantics: {$ref: '#/components/schemas/JsonObject'}
        configHash: {type: string, pattern: '^[0-9a-f]{64}$'}
        resultStandardFieldDictionaryId: {type: [string, 'null'], format: uuid}
        catalogProposalId: {type: [string, 'null'], format: uuid}
        publishedAt: {type: [string, 'null'], format: date-time}
        createdAt: {type: string, format: date-time}
    InputFieldVersion:
      type: object
      additionalProperties: false
      required: [id, inputFieldId, version, status, valueType, availabilityStage, definition, preprocessing, configHash, createdAt]
      properties:
        id: {type: string, format: uuid}
        inputFieldId: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        status: {enum: [DRAFT, PUBLISHED, RETIRED]}
        valueType: {enum: [NUMBER, STRING, BOOLEAN, CATEGORY, COMPOSITION]}
        unit: {type: [string, 'null']}
        availabilityStage: {enum: [PRE_EXPERIMENT, POST_EXPERIMENT]}
        standardFieldDictionaryId: {type: [string, 'null'], format: uuid}
        standardFieldCode: {type: [string, 'null']}
        definition: {$ref: '#/components/schemas/JsonObject'}
        preprocessing: {$ref: '#/components/schemas/JsonObject'}
        configHash: {type: string, pattern: '^[0-9a-f]{64}$'}
        publishedAt: {type: [string, 'null'], format: date-time}
        createdAt: {type: string, format: date-time}
    SourceMapping:
      type: object
      additionalProperties: false
      required: [id, targetId, targetVersionId, sourceType, version, status, mapping, mappingHash, createdAt]
      properties:
        id: {type: string, format: uuid}
        targetId: {type: string, format: uuid}
        targetVersionId: {type: string, format: uuid}
        sourceType: {enum: [DATA_CENTER, EXPERIMENT]}
        version: {type: integer, minimum: 1}
        status: {enum: [DRAFT, PUBLISHED, RETIRED]}
        mapping: {$ref: '#/components/schemas/JsonObject'}
        mappingHash: {type: string, pattern: '^[0-9a-f]{64}$'}
        publishedAt: {type: [string, 'null'], format: date-time}
        createdAt: {type: string, format: date-time}
    InputSchemeField:
      type: object
      additionalProperties: false
      required: [inputFieldVersionId, required, ordinal, override]
      properties:
        inputFieldVersionId: {type: string, format: uuid}
        fieldCode: {type: [string, 'null']}
        fieldName: {type: [string, 'null']}
        valueType: {type: [string, 'null']}
        unit: {type: [string, 'null']}
        availabilityStage: {type: [string, 'null']}
        required: {type: boolean}
        ordinal: {type: integer, minimum: 0}
        override: {$ref: '#/components/schemas/JsonObject'}
    InputScheme:
      type: object
      additionalProperties: false
      required: [id, targetId, targetVersionId, code, name, version, status, fields, preprocessing, configHash, revision, createdAt]
      properties:
        id: {type: string, format: uuid}
        targetId: {type: string, format: uuid}
        targetVersionId: {type: string, format: uuid}
        materialDictionaryVersionId: {type: [string, 'null'], format: uuid}
        materialDictionaryCode: {type: [string, 'null']}
        code: {type: string}
        name: {type: string}
        version: {type: integer, minimum: 1}
        status: {enum: [DRAFT, FROZEN, RETIRED]}
        fields: {type: array, items: {$ref: '#/components/schemas/InputSchemeField'}}
        preprocessing: {$ref: '#/components/schemas/JsonObject'}
        configHash: {type: string, pattern: '^[0-9a-f]{64}$'}
        revision: {type: integer, minimum: 0}
        frozenAt: {type: [string, 'null'], format: date-time}
        createdAt: {type: string, format: date-time}
