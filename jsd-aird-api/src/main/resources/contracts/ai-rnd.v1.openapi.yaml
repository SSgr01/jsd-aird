        - $ref: '#/components/schemas/ContinuousPrediction'
        - $ref: '#/components/schemas/OrdinalPrediction'
        - $ref: '#/components/schemas/BinaryPrediction'
        - $ref: '#/components/schemas/CategoricalPrediction'
      discriminator: {propertyName: resultType}
    ContinuousPrediction:
      type: object
      additionalProperties: false
      required: [resultType, value]
      properties:
        resultType: {const: CONTINUOUS}
        value: {type: number}
        unit: {type: [string, 'null']}
        interval:
          type: [object, 'null']
          properties:
            lower: {type: number}
            upper: {type: number}
            coverageLevel: {type: number, exclusiveMinimum: 0, exclusiveMaximum: 1}
    OrdinalPrediction:
      type: object
      additionalProperties: false
      required: [resultType, label, probabilities]
      properties:
        resultType: {const: ORDINAL}
        label: {type: string}
        probabilities: {type: object, additionalProperties: {type: number, minimum: 0, maximum: 1}}
        thresholdProbability: {type: [number, 'null'], minimum: 0, maximum: 1}
    BinaryPrediction:
      type: object
      additionalProperties: false
      required: [resultType, label, positiveClass, probability, decisionThreshold]
      properties:
        resultType: {const: BINARY}
        label: {type: string}
        positiveClass: {type: string}
        probability: {type: number, minimum: 0, maximum: 1}
        decisionThreshold: {type: number, exclusiveMinimum: 0, exclusiveMaximum: 1}
    CategoricalPrediction:
      type: object
      additionalProperties: false
      required: [resultType, label, probabilities]
      properties:
        resultType: {const: CATEGORICAL}
        label: {type: string}
        probabilities: {type: object, additionalProperties: {type: number, minimum: 0, maximum: 1}}
    TargetResult:
      oneOf:
        - $ref: '#/components/schemas/TargetSuccess'
        - $ref: '#/components/schemas/TargetBlocked'
        - $ref: '#/components/schemas/TargetFailed'
      discriminator: {propertyName: status}
    TargetSuccess:
      type: object
      additionalProperties: false
      required: [targetId, status, prediction, modelVersionId, targetVersionId, inputSchemeId, snapshotId]
      properties:
        targetId: {type: string, format: uuid}
        status: {const: SUCCEEDED}
        prediction: {$ref: '#/components/schemas/TypedPrediction'}
        modelVersionId: {type: string, format: uuid}
        targetVersionId: {type: string, format: uuid}
        inputSchemeId: {type: string, format: uuid}
        snapshotId: {type: string, format: uuid}
    TargetBlocked:
      type: object
      additionalProperties: false
      required: [targetId, status, errorCode, message]
      properties:
        targetId: {type: string, format: uuid}
        status: {const: BLOCKED}
        errorCode: {type: string}
        message: {type: string}
        detail: {$ref: '#/components/schemas/JsonObject'}
    TargetFailed:
      type: object
      additionalProperties: false
      required: [targetId, status, errorCode, message, detail]
      properties:
        targetId: {type: string, format: uuid}
        status: {const: FAILED}
        modelVersionId: {type: [string, 'null'], format: uuid}
        errorCode: {type: string}
        message: {type: string}
        detail: {$ref: '#/components/schemas/JsonObject'}
    PredictionResponse:
      type: object
      required: [requestId, predictionId, executionStatus, outcomeStatus, results]
      properties:
        requestId: {type: string}
        predictionId: {type: string, format: uuid}
        executionStatus: {enum: [SUCCEEDED, FAILED]}
        outcomeStatus: {type: [string, 'null'], enum: [SUCCEEDED, PARTIAL, BLOCKED, null]}
        results: {type: array, items: {$ref: '#/components/schemas/TargetResult'}}
        warnings: {type: array, items: {$ref: '#/components/schemas/JsonObject'}}
    PredictionRunning:
      type: object
      additionalProperties: false
      required: [predictionRecordId, requestId, executionStatus, outcomeStatus, pollAfterMs]
      properties:
        predictionRecordId: {type: string, format: uuid}
        requestId: {type: string}
        executionStatus: {const: RUNNING}
        outcomeStatus: {type: 'null'}
        pollAfterMs: {type: integer, minimum: 100}
    QualityRule:
      type: object
      additionalProperties: false
      required: [code, priority, when, trustLevel, explanation]
      properties:
        code: {type: string, minLength: 1}
        priority: {type: integer, minimum: 0}
        when: {$ref: '#/components/schemas/JsonObject'}
        trustLevel: {enum: [HIGH, MEDIUM, LOW]}
        explanation: {type: string, minLength: 1}
    QualityPolicyCommand:
      type: object
      additionalProperties: false
      required: [defaultTrustLevel, defaultExplanation, rules, expectedRevision]
      properties:
        defaultTrustLevel: {enum: [HIGH, MEDIUM, LOW]}
        defaultExplanation: {type: string, minLength: 1}
        rules: {type: array, items: {$ref: '#/components/schemas/QualityRule'}}
        expectedRevision: {type: integer, minimum: 0}
    QualityPolicy:
      type: object
      additionalProperties: false
      required: [id, targetId, version, status, kind, defaultTrustLevel, defaultExplanation, rules, policyHash, revision, createdAt]
      properties:
        id: {type: string, format: uuid}
        targetId: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        status: {enum: [DRAFT, PUBLISHED, RETIRED]}
        kind: {const: QUALITY}
        defaultTrustLevel: {enum: [HIGH, MEDIUM, LOW]}
        defaultExplanation: {type: string}
        rules: {type: array, items: {$ref: '#/components/schemas/QualityRule'}}
        policyHash: {type: string, pattern: '^[0-9a-f]{64}$'}
        revision: {type: integer, minimum: 0}
        publishedAt: {type: [string, 'null'], format: date-time}
        createdAt: {type: string, format: date-time}
    SampleSummary:
      type: object
      additionalProperties: false
      required: [id, logicalSampleKey, identityVersion, status, revision, sourceCount, updatedAt]
      properties:
        id: {type: string, format: uuid}
        logicalSampleKey: {type: string}
        identityVersion: {type: integer, minimum: 1}
        authoritySourceType: {type: [string, 'null'], enum: [DATA_CENTER, EXPERIMENT, null]}
        status: {enum: [ACTIVE, SUSPENDED, INVALIDATED]}
        takeoverExperimentId: {type: [string, 'null'], format: uuid}
        takeoverExperimentVersionId: {type: [string, 'null'], format: uuid}
        revision: {type: integer, minimum: 0}
        sourceCount: {type: integer, minimum: 0}
        updatedAt: {type: string, format: date-time}
    SampleSource:
      type: object
      additionalProperties: false
      required: [id, sourceType, sourceBusinessKey, sampleBoundaryId, logicalSampleKey, sourceGroupKeys, sourceVersion, sourceSequence, contentHash, status, createdAt, redacted]
      properties:
        id: {type: string, format: uuid}
        sourceType: {enum: [DATA_CENTER, EXPERIMENT]}
        sourceBusinessKey: {type: string}
        sampleBoundaryId: {type: string}
        logicalSampleKey: {type: string}
        sourceGroupKeys: {type: array, minItems: 1, items: {type: string}}
        sourceVersion: {type: string}
        sourceSequence: {type: integer, minimum: 1}
        contentHash: {type: string, pattern: '^[0-9a-f]{64}$'}
        status: {enum: [CURRENT, SUPERSEDED, TAKEN_OVER, INVALIDATED]}
        confirmedSubmissionItemId: {type: [string, 'null'], format: uuid}
        experimentVersionId: {type: [string, 'null'], format: uuid}
        recognitionJobId: {type: [string, 'null'], format: uuid}
        experimentId: {type: [string, 'null'], format: uuid}
        revisionId: {type: [string, 'null'], format: uuid}
        composition: {oneOf: [{$ref: '#/components/schemas/JsonObject'}, {type: 'null'}]}
        process: {oneOf: [{$ref: '#/components/schemas/JsonObject'}, {type: 'null'}]}
        conditions: {oneOf: [{$ref: '#/components/schemas/JsonObject'}, {type: 'null'}]}
        observations: {oneOf: [{$ref: '#/components/schemas/JsonObject'}, {type: 'null'}]}
        facts: {oneOf: [{$ref: '#/components/schemas/JsonObject'}, {type: 'null'}]}
        permissionScope: {oneOf: [{$ref: '#/components/schemas/JsonObject'}, {type: 'null'}]}
        sourceCoordinates: {oneOf: [{$ref: '#/components/schemas/JsonObject'}, {type: 'null'}]}
        factHash: {type: [string, 'null']}
        createdAt: {type: string, format: date-time}
        redacted: {type: boolean}
    IdentityIssue:
      type: object
      additionalProperties: false
      required: [id, issueType, status, evidence, revision, createdAt]
      properties:
        id: {type: string, format: uuid}
        issueType: {type: string}
        status: {enum: [OPEN, CONFIRMED_SAME, CONFIRMED_DISTINCT, DISMISSED]}
        evidence: {$ref: '#/components/schemas/JsonObject'}
        resolution: {oneOf: [{$ref: '#/components/schemas/JsonObject'}, {type: 'null'}]}
        revision: {type: integer, minimum: 0}
        createdAt: {type: string, format: date-time}
        resolvedAt: {type: [string, 'null'], format: date-time}
    SamplePage:
      type: object
      required: [items, page, size, total, totalPages]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/SampleSummary'}}
        page: {type: integer, minimum: 1}
        size: {type: integer, minimum: 1, maximum: 100}
        total: {type: integer, minimum: 0}
        totalPages: {type: integer, minimum: 0}
    SampleDetail:
      type: object
      additionalProperties: false
      required: [summary, sources, identityIssues]
      properties:
        summary: {$ref: '#/components/schemas/SampleSummary'}
        sources: {type: array, items: {$ref: '#/components/schemas/SampleSource'}}
        identityIssues: {type: array, items: {$ref: '#/components/schemas/IdentityIssue'}}
    ReconcileResult:
      type: object
      additionalProperties: false
      required: [projectedSubmissionItems, projectedExperimentSamples, scannedSources]
      properties:
        projectedSubmissionItems: {type: integer, minimum: 0}
        projectedExperimentSamples: {type: integer, minimum: 0}
        scannedSources: {type: integer, minimum: 0}
    FormulaGoal:
      type: object
      additionalProperties: false
      required: [targetId, valueType, operator, value, mandatory, weight]
      properties:
        targetId: {type: string, format: uuid}
        valueType: {enum: [CONTINUOUS, ORDINAL, BINARY, CATEGORICAL]}
        operator: {enum: [AT_LEAST, AT_MOST, RANGE, MATCH, MAXIMIZE, MINIMIZE]}
        value: {}
        mandatory: {type: boolean}
        weight: {type: number, exclusiveMinimum: 0}
        minimumProbability: {type: [number, 'null'], minimum: 0, maximum: 1}
        expectedModelVersionId: {type: [string, 'null'], format: uuid}
    FormulaDesignRequest:
      type: object
      additionalProperties: false
      required: [typedGoals, targetTotal, formulaBasis, baselineFormula, fixedInputs, searchSpace, constraints, candidateCount]
      properties:
        typedGoals: {type: array, minItems: 1, items: {$ref: '#/components/schemas/FormulaGoal'}}
        targetTotal: {type: number, exclusiveMinimum: 0}
        formulaBasis: {enum: [MASS_PERCENT]}
        baselineFormula: {$ref: '#/components/schemas/PredictionFormula'}
        fixedInputs: {$ref: '#/components/schemas/JsonObject'}
        searchSpace: {$ref: '#/components/schemas/JsonObject'}
        constraints: {$ref: '#/components/schemas/JsonObject'}
        candidateCount: {type: integer, minimum: 1, maximum: 16, default: 4}
    FormulaDesignAccepted:
      type: object
      additionalProperties: false
      required: [runId, asyncJobId, executionStatus, modelBindings, pollAfterMs]
      properties:
        runId: {type: string, format: uuid}
        asyncJobId: {type: string, format: uuid}
        executionStatus: {enum: [QUEUED, RUNNING]}
        modelBindings: {type: object, additionalProperties: {type: string, format: uuid}}
        pollAfterMs: {type: integer, minimum: 100}
    OptimizationBaselineRef:
      type: object
      additionalProperties: false
      required: [type, id, versionId]
      properties:
        type: {enum: [EXPERIMENT_VERSION, DATA_SAMPLE_REVISION, RESEARCH_CANDIDATE]}
        id: {type: string, format: uuid}
        versionId: {type: string, format: uuid}
        contentHash: {type: [string, 'null'], pattern: '^[0-9a-f]{64}$'}
    OptimizationVariable:
      type: object
      additionalProperties: true
      required: [minimum, maximum]
      properties:
        materialId: {type: [string, 'null'], format: uuid}
        code: {type: [string, 'null']}
        minimum: {type: number}
        maximum: {type: number}
        step: {type: [number, 'null'], exclusiveMinimum: 0}
    OptimizationRequest:
      type: object
      additionalProperties: false
      required: [baselineRef, typedGoals, targetTotal, variableMaterials, variableInputs, constraints]
      properties:
        baselineRef: {$ref: '#/components/schemas/OptimizationBaselineRef'}
        typedGoals: {type: array, minItems: 1, items: {$ref: '#/components/schemas/FormulaGoal'}}
        targetTotal: {type: number, exclusiveMinimum: 0}
        variableMaterials: {type: array, items: {$ref: '#/components/schemas/OptimizationVariable'}}
        variableInputs: {type: array, items: {$ref: '#/components/schemas/OptimizationVariable'}}
        constraints: {$ref: '#/components/schemas/JsonObject'}
        candidateCount: {const: 4}
    ExperimentDraftCommand:
      type: object
      additionalProperties: false
      required: [candidateIds, categoryId, plannedExperimentDate]
      properties:
        candidateIds: {type: array, minItems: 1, maxItems: 4, uniqueItems: true, items: {type: string, format: uuid}}
        categoryId: {type: string, format: uuid}
        plannedExperimentDate: {type: string, format: date}
        projectId: {type: [string, 'null'], format: uuid}
        stageId: {type: [string, 'null'], format: uuid}
        taskId: {type: [string, 'null'], format: uuid}
        ownerName: {type: [string, 'null'], maxLength: 100}
    ResearchCandidate:
      type: object
      additionalProperties: false
      required: [id, candidateNo, title, formula, targetResults, quality, applicability, ruleCheck, score]
      properties:
        id: {type: string, format: uuid}
        candidateNo: {type: integer, minimum: 1}
        title: {type: string}
        formula: {$ref: '#/components/schemas/PredictionFormula'}
        targetResults: {$ref: '#/components/schemas/JsonObject'}
        quality: {$ref: '#/components/schemas/JsonObject'}
        applicability: {$ref: '#/components/schemas/JsonObject'}
        ruleCheck: {$ref: '#/components/schemas/JsonObject'}
        score: {type: number}
    ResearchRun:
      type: object
      additionalProperties: false
      required: [id, runType, executionStatus, outcomeStatus, progress, requestedCandidateCount, actualCandidateCount, candidates, modelBindings, requestId]
      properties:
        id: {type: string, format: uuid}
        runType: {const: FORMULA_PREDICTION}
        executionStatus: {enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLED]}
        outcomeStatus: {type: [string, 'null'], enum: [SUCCEEDED, PARTIAL, BLOCKED, null]}
        progress: {type: integer, minimum: 0, maximum: 100}
        currentStage: {type: [string, 'null']}
        requestedCandidateCount: {type: integer, minimum: 1}
        actualCandidateCount: {type: integer, minimum: 0}
        candidates: {type: array, items: {$ref: '#/components/schemas/ResearchCandidate'}}
        shortfallReason: {type: [string, 'null']}
        modelBindings: {type: object, additionalProperties: {type: string, format: uuid}}
        frozenEvidence: {$ref: '#/components/schemas/JsonObject'}
        requestId: {type: string}
        updatedAt: {type: [string, 'null'], format: date-time}
    ResearchPage:
      type: object
      additionalProperties: false
      required: [items, total, page, size]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ResearchRun'}}
        total: {type: integer, minimum: 0}
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1, maximum: 100}
    SamplePageResponse: {allOf: [{$ref: '#/components/schemas/ResponseMetadata'}, {type: object, required: [data], properties: {data: {$ref: '#/components/schemas/SamplePage'}}}]}
    SampleDetailResponse: {allOf: [{$ref: '#/components/schemas/ResponseMetadata'}, {type: object, required: [data], properties: {data: {$ref: '#/components/schemas/SampleDetail'}}}]}
    ReconcileResultResponse: {allOf: [{$ref: '#/components/schemas/ResponseMetadata'}, {type: object, required: [data], properties: {data: {$ref: '#/components/schemas/ReconcileResult'}}}]}
    FormulaDesignAcceptedResponse: {allOf: [{$ref: '#/components/schemas/ResponseMetadata'}, {type: object, required: [data], properties: {data: {$ref: '#/components/schemas/FormulaDesignAccepted'}}}]}
    ResearchPageResponse: {allOf: [{$ref: '#/components/schemas/ResponseMetadata'}, {type: object, required: [data], properties: {data: {$ref: '#/components/schemas/ResearchPage'}}}]}
    ResearchRunResponse: {allOf: [{$ref: '#/components/schemas/ResponseMetadata'}, {type: object, required: [data], properties: {data: {$ref: '#/components/schemas/ResearchRun'}}}]}
  x-operation-templates:
    readPage: &readPage {operationId: templateReadPage, tags: [Modeling], x-permission: ai.modeling.read, parameters: [{$ref: '#/components/parameters/RequestId'}, {$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/Size'}], responses: {'200': {$ref: '#/components/responses/Page'}, '403': {$ref: '#/components/responses/Forbidden'}}}
    readOne: &readOne {operationId: templateReadOne, tags: [Modeling], x-permission: ai.modeling.read, parameters: [{$ref: '#/components/parameters/RequestId'}, {$ref: '#/components/parameters/Id'}], responses: {'200': {$ref: '#/components/responses/Ok'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}}}
    modelWrite: &modelWrite {operationId: templateModelWrite, tags: [Modeling], x-permission: ai.modeling.manage, parameters: [{$ref: '#/components/parameters/RequestId'}, {$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/JsonObject'}}}}, responses: {'200': {$ref: '#/components/responses/Ok'}, '400': {$ref: '#/components/responses/BadRequest'}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/Blocked'}}}
  responses:
    Ok: {description: Success, content: {application/json: {schema: {$ref: '#/components/schemas/JsonObject'}}}}
    Page: {description: Stable page ordered by updatedAt and id, content: {application/json: {schema: {$ref: '#/components/schemas/Page'}}}}
    Target: {description: Prediction target, content: {application/json: {schema: {$ref: '#/components/schemas/TargetResponse'}}}}
    TargetPage: {description: Stable target page, content: {application/json: {schema: {$ref: '#/components/schemas/TargetPageResponse'}}}}
    TargetVersion: {description: Target definition version, content: {application/json: {schema: {$ref: '#/components/schemas/TargetVersionResponse'}}}}
    TargetVersionList: {description: Target definition version history, content: {application/json: {schema: {$ref: '#/components/schemas/TargetVersionListResponse'}}}}
    InputField: {description: Input field, content: {application/json: {schema: {$ref: '#/components/schemas/InputFieldResponse'}}}}
    InputFieldPage: {description: Stable input field page, content: {application/json: {schema: {$ref: '#/components/schemas/InputFieldPageResponse'}}}}
    InputSuggestionPage: {description: X candidates discovered from current authoritative facts, content: {application/json: {schema: {$ref: '#/components/schemas/InputSuggestionPageResponse'}}}}
    InputFieldVersion: {description: Input field version, content: {application/json: {schema: {$ref: '#/components/schemas/InputFieldVersionResponse'}}}}
    InputFieldVersionList: {description: Input field version history, content: {application/json: {schema: {$ref: '#/components/schemas/InputFieldVersionListResponse'}}}}
    SourceMapping: {description: Source mapping version, content: {application/json: {schema: {$ref: '#/components/schemas/SourceMappingResponse'}}}}
    SourceMappingList: {description: Source mapping versions, content: {application/json: {schema: {$ref: '#/components/schemas/SourceMappingListResponse'}}}}
    InputScheme: {description: Input scheme, content: {application/json: {schema: {$ref: '#/components/schemas/InputSchemeResponse'}}}}
    InputSchemeList: {description: Input schemes, content: {application/json: {schema: {$ref: '#/components/schemas/InputSchemeListResponse'}}}}
    CoveragePreview: {description: Configuration preview without sample counts before R04, content: {application/json: {schema: {$ref: '#/components/schemas/CoveragePreviewResponse'}}}}
    EligibilitySummary: {description: Qualification summary and funnel, content: {application/json: {schema: {$ref: '#/components/schemas/EligibilitySummaryResponse'}}}}
    EligibilityPage: {description: Stable qualification page, content: {application/json: {schema: {$ref: '#/components/schemas/EligibilityPageResponse'}}}}
    EligibilityDetail: {description: Qualification detail and reviews, content: {application/json: {schema: {$ref: '#/components/schemas/EligibilityDetailResponse'}}}}
    RecomputeAccepted: {description: Qualification recomputation queued, content: {application/json: {schema: {$ref: '#/components/schemas/RecomputeAcceptedResponse'}}}}
    ReviewDecision: {description: Review decision result, content: {application/json: {schema: {$ref: '#/components/schemas/ReviewDecisionResponse'}}}}
    FreezeResult: {description: Frozen scheme and deferred recompute state, content: {application/json: {schema: {$ref: '#/components/schemas/FreezeResultResponse'}}}}
    TrainingPolicy: {description: Training policy version, content: {application/json: {schema: {$ref: '#/components/schemas/TrainingPolicyResponse'}}}}
    TrainingPolicyList: {description: Training policy versions, content: {application/json: {schema: {$ref: '#/components/schemas/TrainingPolicyListResponse'}}}}
    StandardFieldList: {description: Active standard field projection, content: {application/json: {schema: {$ref: '#/components/schemas/StandardFieldListResponse'}}}}
    MaterialReferenceList: {description: Active MDM material projection, content: {application/json: {schema: {$ref: '#/components/schemas/MaterialReferenceListResponse'}}}}
    MaterialAlias: {description: Material alias, content: {application/json: {schema: {$ref: '#/components/schemas/MaterialAliasResponse'}}}}
    MaterialAliasList: {description: Material aliases, content: {application/json: {schema: {$ref: '#/components/schemas/MaterialAliasListResponse'}}}}
    MaterialDictionary: {description: Material dictionary version, content: {application/json: {schema: {$ref: '#/components/schemas/MaterialDictionaryResponse'}}}}
    MaterialDictionaryList: {description: Material dictionary versions, content: {application/json: {schema: {$ref: '#/components/schemas/MaterialDictionaryListResponse'}}}}
    Bootstrap: {description: Idempotent UV/PU catalog bootstrap result, content: {application/json: {schema: {$ref: '#/components/schemas/BootstrapResponse'}}}}
    TrainingSettings: {description: Organization training scheduler settings, content: {application/json: {schema: {$ref: '#/components/schemas/TrainingSettingsResponse'}}}}
    TrainingEvaluation: {description: Per-target result of checking ready training configurations, content: {application/json: {schema: {$ref: '#/components/schemas/TrainingEvaluationResponse'}}}}
    TrainingJobPage: {description: Stable training job page, content: {application/json: {schema: {$ref: '#/components/schemas/TrainingJobPageResponse'}}}}
    TrainingJobDetail: {description: Training job, immutable snapshot summary and attempts, content: {application/json: {schema: {$ref: '#/components/schemas/TrainingJobDetailResponse'}}}}
    TrainingJobAction: {description: Retry or cancellation result, content: {application/json: {schema: {$ref: '#/components/schemas/TrainingJobActionResponse'}}}}
    TrainingSnapshot: {description: Immutable training snapshot, content: {application/json: {schema: {$ref: '#/components/schemas/TrainingSnapshotResponse'}}}}
    TrainingSnapshotItems: {description: Immutable snapshot items in stable ordinal order, content: {application/json: {schema: {$ref: '#/components/schemas/TrainingSnapshotItemsResponse'}}}}
    ModelPage: {description: Stable model version page, content: {application/json: {schema: {$ref: '#/components/schemas/ModelPageResponse'}}}}
    ModelDetail: {description: Model version with validation, domain, card and release history, content: {application/json: {schema: {$ref: '#/components/schemas/ModelDetailResponse'}}}}
    ModelComparison: {description: Candidate, active and baseline comparison evidence, content: {application/json: {schema: {$ref: '#/components/schemas/ModelComparisonResponse'}}}}
    ModelAction: {description: Atomic activation, pause or rollback result, content: {application/json: {schema: {$ref: '#/components/schemas/ModelActionResponse'}}}}
    SamplePage: {description: Unified logical samples in stable updatedAt/id order, content: {application/json: {schema: {$ref: '#/components/schemas/SamplePageResponse'}}}}
    SampleDetail: {description: Unified sample lineage with values redacted when source permission is absent, content: {application/json: {schema: {$ref: '#/components/schemas/SampleDetailResponse'}}}}
    ReconcileResult: {description: Fact projection reconciliation result, content: {application/json: {schema: {$ref: '#/components/schemas/ReconcileResultResponse'}}}}
    Accepted: {description: Accepted immutable model-bound run, content: {application/json: {schema: {$ref: '#/components/schemas/JsonObject'}}}}
    BadRequest: {description: Malformed request, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Forbidden: {description: Permission denied, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    NotFound: {description: Missing or inaccessible resource, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Conflict: {description: Version or idempotency conflict, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Blocked: {description: Business gate blocked, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Unavailable: {description: Compute or artifact unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  x-operations:
